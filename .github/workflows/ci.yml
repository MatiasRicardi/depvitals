name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest version declared in engines.node: catches reliance on newer runtime APIs.
          - os: ubuntu-latest
            node-version: '22.13.0'
          - os: ubuntu-latest
            node-version: '22'
            coverage: true
          - os: ubuntu-latest
            node-version: '24'
          - os: ubuntu-latest
            node-version: '26'
          - os: macos-latest
            node-version: '22'
          - os: windows-latest
            node-version: '26'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (with coverage)
        if: ${{ matrix.coverage }}
        run: pnpm run test:coverage

      - name: Test
        if: ${{ !matrix.coverage }}
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: error

  # Single stable check for branch protection: green only when every verify job succeeded.
  # Branch protection requires "CI", never the per-combination "Verify (...)" names.
  ci:
    name: CI
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate verify result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "::error::verify matrix did not succeed (result: $VERIFY_RESULT)"
            exit 1
          fi

          echo "All verify jobs succeeded."
