name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest version declared in engines.node: catches reliance on newer runtime APIs.
          - os: ubuntu-latest
            node-version: '22.13.0'
          - os: ubuntu-latest
            node-version: '22'
            coverage: true
          - os: ubuntu-latest
            node-version: '24'
          - os: ubuntu-latest
            node-version: '26'
          - os: macos-latest
            node-version: '22'
          - os: windows-latest
            node-version: '26'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Built before the tests: the process-level CLI gates execute dist/cli/index.js, and the
      # shared Vitest globalSetup must find a current artifact rather than compile one per worker.
      - name: Build
        run: pnpm run build

      - name: Test (with coverage)
        if: ${{ matrix.coverage }}
        run: pnpm run test:coverage

      - name: Test
        if: ${{ !matrix.coverage }}
        run: pnpm run test

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: error

  # Verify the packaged CLI exactly as an npm consumer receives it: pack the real artifact,
  # install the tarball into an isolated temporary project, and execute the installed `depvitals`
  # executable. Runs once on Linux; the verify matrix already covers the OS/Node combinations.
  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify packaged CLI as a consumer
        run: pnpm run verify:package

  # Single stable check for branch protection: green only when every verify job AND the package
  # smoke test succeeded. Branch protection requires "CI", never the per-combination "Verify (...)"
  # or "Package smoke" names.
  ci:
    name: CI
    needs: [verify, package-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "::error::verify matrix did not succeed (result: $VERIFY_RESULT)"
            exit 1
          fi

          if [ "$PACKAGE_SMOKE_RESULT" != "success" ]; then
            echo "::error::package-smoke did not succeed (result: $PACKAGE_SMOKE_RESULT)"
            exit 1
          fi

          echo "All verify jobs and the package smoke test succeeded."
