name: Bug report
description: Report incorrect behavior (wrong result, crash, bad detection).
title: '[bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report the exact version or development commit you ran. JSON and package explanations
        are available in v0.4.0 and later. Redact private paths and values from any artifacts.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you expected and what DepVitals reported instead.
      placeholder: DepVitals reported `moment` as unused, but it is imported in `src/date.ts`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Provide a minimal project or excerpts that reproduce the behavior. Include the selected
        root, exact command, relevant package.json groups and scripts, policy/config files and
        source or path layout. Include any nested manifests that affect ownership.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit status
      description: |
        Include stdout, stderr and the numeric exit status. On a build that supports them,
        use `--format json` for the scan and `--explain <package>` for the affected package.
        Keep an empty stdout explicit for an operational error. Redact private paths or values.
    validations:
      required: true
  - type: input
    id: depvitals-version
    attributes:
      label: DepVitals version
      description: Run depvitals --version. For a development build, include the commit SHA.
      placeholder: '0.4.1 or development commit SHA'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, package manager version.
      placeholder: Linux, Node.js 22.13.0, pnpm 11
    validations:
      required: true
  - type: textarea
    id: ecosystem
    attributes:
      label: Ecosystem details
      description: Module system, framework, monorepo layout, TypeScript version, import styles.
